  <style>
    :root {
      --purple: #5B2DD6;
      --purple-dark: #4A21B8;
      --lavender: #EFEAFF;
      --lavender-soft: #F7F5FF;
      --lavender-border: #DCD4FA;
      --navy: #1E1B4B;
      --green: #18A957;
      --green-dark: #148F49;
      --red: #E53935;
      --yellow: #FFCA28;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--navy);
      background: #FAF9FF;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .btn-purple {
      background: var(--purple);
      color: #fff;
      transition: background-color 0.15s ease;
    }
    .btn-purple:hover { background: var(--purple-dark); }
    .btn-green {
      background: var(--green);
      color: #fff;
      transition: background-color 0.15s ease;
    }
    .btn-green:hover { background: var(--green-dark); }
    .btn-red {
      background: var(--red);
      color: #fff;
      transition: background-color 0.15s ease;
    }
    .btn-red:hover { background: #C62828; }
    .card-soft {
      background: #fff;
      border: 1.5px solid #EAE6FA;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(91, 45, 214, 0.05);
    }
    .card-selectable:hover {
      border-color: var(--purple);
      box-shadow: 0 6px 20px rgba(91, 45, 214, 0.10);
    }
    .card-selected {
      border-color: var(--purple) !important;
      background: #F4F0FF !important;
      box-shadow: 0 6px 20px rgba(91, 45, 214, 0.14) !important;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #D4CCF5; border-radius: 999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-full bg-[#1E1B4B] text-white text-sm font-medium shadow-lg"></div>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden bg-black/40 flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-[#EAE6FA] max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Main App Root -->
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <!-- Screen Navigator Drawer -->
  <div class="fixed bottom-4 right-4 z-40">
    <button id="nav-toggle-btn" onclick="toggleScreenDrawer()" class="flex items-center gap-2 px-3.5 py-2 rounded-full bg-[#1E1B4B]/90 hover:bg-[#1E1B4B] text-white text-xs font-semibold shadow-lg">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span id="nav-badge">Screen 1 / 26</span>
    </button>
    <div id="screen-drawer" class="hidden absolute bottom-12 right-0 w-72 bg-white rounded-2xl shadow-2xl border border-[#DCD4FA] p-3 max-h-[70vh] overflow-y-auto">
      <div class="flex items-center justify-between px-2 pb-2 mb-2 border-b border-[#EFEAFF]">
        <span class="text-xs font-bold uppercase tracking-wider text-[#5B2DD6]">All Screens</span>
        <button onclick="toggleScreenDrawer()" class="text-xs text-slate-400 hover:text-slate-700 font-semibold">Close</button>
      </div>
      <div id="screen-drawer-list" class="space-y-1 text-xs"></div>
    </div>

function loadSavedStore() {
  try {
    const raw = localStorage.getItem('labhya_store_v1');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { savedProfiles: {}, loggedInMobile: '', langCode: 'en' };
}

function persistStore() {
  try {
    localStorage.setItem('labhya_store_v1', JSON.stringify({
      savedProfiles: state.savedProfiles,
      loggedInMobile: state.loggedInMobile,
      langCode: state.langCode
    }));
  } catch (e) {}
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 2600);
}

// Keyboard Enter key support - activate focused buttons without duplicate submissions
document.onkeydown = function(e) {
  if (e.key === 'Enter') {
    const focused = document.activeElement;
    // Activate focused buttons
    if (focused.tagName === 'BUTTON') {
      e.preventDefault();
      // Avoid duplicate: only click if not already processing
      if (!focused.disabled) {
        focused.click();
      }
    }
    // For OTP inputs: allow natural navigation between fields
    else if (focused.tagName === 'INPUT' && focused.type !== 'text' && focused.type !== 'file') {
      // Let numeric/OTP inputs handle Enter naturally
    }
    // For text/textarea: let Enter work naturally
    else if (focused.tagName === 'TEXTAREA' || (focused.tagName === 'INPUT' && focused.type === 'text')) {
      // Allow natural Enter behavior for text fields
    }
  }
}

function speakText(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const langObj = LANGUAGES.find(l => l.code === state.langCode) || LANGUAGES[0];
      u.lang = langObj.speech;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
      showToast('🔊 ' + text.slice(0, 44) + (text.length > 44 ? '...' : ''));
    }
  } catch (e) {}
}

function goTo(screenId) {
  state.screen = screenId;
  state.mobileSidebarOpen = false;
  if (screenId === 'otp') startOtpTimer();
  else clearInterval(otpInterval);
  render();
}

function startOtpTimer() {
  clearInterval(otpInterval);
  state.otpTimer = 30;
  otpInterval = setInterval(() => {
    if (state.otpTimer > 0) {
      state.otpTimer--;
      const el = document.getElementById('otp-timer-text');
      if (el) el.textContent = `${t('resendOtp')} (00:${String(state.otpTimer).padStart(2, '0')})`;
    } else {
      clearInterval(otpInterval);
    }
  }, 1000);
}

function languagePillHTML() {
  return `
  <div class="relative inline-block">
    <select aria-label="Language" onchange="changeLanguage(this.value)" class="appearance-none bg-white border border-[#DCD4FA] text-[#1E1B4B] text-sm font-semibold rounded-full pl-4 pr-9 py-1.5 cursor-pointer focus:outline-none focus:border-[#5B2DD6]">
      ${LANGUAGES.map(l => `<option value="${l.code}" ${state.langCode === l.code ? 'selected' : ''}>${l.label}</option>`).join('')}
    </select>
    <svg class="w-4 h-4 text-[#5B2DD6] pointer-events-none absolute right-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </div>`;
}

function changeLanguage(code) {
  state.langCode = code;
  persistStore();
  const langObj = LANGUAGES.find(l => l.code === code);
  if (langObj) showToast('Language: ' + langObj.native);
  render();
}

function speakerBtnHTML(textToSpeak) {
  const safe = textToSpeak.replace(/'/g, "\\'");
  return `
  <button onclick="speakText('${safe}')" title="Listen" class="w-9 h-9 rounded-full bg-[#EFEAFF] hover:bg-[#E1D7FF] text-[#5B2DD6] flex items-center justify-center">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>`;
}

function onboardingHeaderHTML({ backScreen = null, step = null, totalSteps = 11, speak = '' }) {
  const dots = step !== null ? `
    <div class="flex items-center gap-1.5">
      ${Array.from({ length: totalSteps }, (_, i) => {
        const idx = i + 1;
        if (idx < step) return `<span class="w-2.5 h-2.5 rounded-full bg-[#18A957]"></span>`;
        if (idx === step) return `<span class="w-6 h-2.5 rounded-full bg-[#5B2DD6]"></span>`;
        return `<span class="w-2.5 h-2.5 rounded-full bg-[#E2DCF8]"></span>`;
      }).join('')}
    </div>` : `<div></div>`;

  return `
  <header class="w-full max-w-4xl mx-auto px-6 pt-5 pb-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      ${backScreen ? `
        <button onclick="goTo('${backScreen}')" class="w-9 h-9 rounded-full hover:bg-[#EFEAFF] text-[#1E1B4B] flex items-center justify-center" title="${t('back')}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>` : `<div class="flex items-center gap-2">${labhyaLogoSVG(34)}<span class="font-bold text-[#5B2DD6] text-lg">Labhya</span></div>`}
    </div>
    <div class="hidden sm:flex justify-center">${dots}</div>
    <div class="flex items-center gap-2.5">
      ${speak ? speakerBtnHTML(speak) : ''}
      ${languagePillHTML()}
    </div>
  </header>
  ${step !== null ? `<div class="sm:hidden flex justify-center pb-2">${dots}</div>` : ''}`;
}

function handleGetStarted() {
  if (state.loggedInMobile && state.savedProfiles[state.loggedInMobile]) {
    Object.assign(state, state.savedProfiles[state.loggedInMobile]);
    goTo('dashboard');
    return;
  }
  goTo('language');
}

function selectLanguageAndStay(code) {
  state.langCode = code;
  persistStore();
  render();
}

function generateMockOtp() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function submitMobile() {
  if (state.mobile.length < 10) {
    showToast('Please enter a valid 10-digit mobile number');
    return;
  }
  state.generatedOtp = generateMockOtp();
  state.otp = ['', '', '', '', '', ''];
  showToast('Mock OTP sent: ' + state.generatedOtp);
  goTo('otp');
}

function resendOtp() {
  state.generatedOtp = generateMockOtp();
  state.otp = ['', '', '', '', '', ''];
  startOtpTimer();
  showToast('New Mock OTP sent: ' + state.generatedOtp);
  render();
}

function updateOtp(idx, val) {
  const clean = val.replace(/\D/g, '').slice(0, 1);
  state.otp[idx] = clean;
  if (clean && idx < 5) {
    const next = document.getElementById('otp-box-' + (idx + 1));
    if (next) next.focus();
  }
}

function handleOtpKey(idx, e) {
  if (e.key === 'Backspace' && !state.otp[idx] && idx > 0) {
    const prev = document.getElementById('otp-box-' + (idx - 1));
    if (prev) prev.focus();
  }
}

function verifyOtp() {
  const entered = state.otp.join('');
  if (entered.length < 6) {
    showToast('Please enter all 6 digits of the OTP');
    return;
  }
  if (state.generatedOtp && entered !== state.generatedOtp) {
    showToast('Incorrect OTP. Mock OTP is ' + state.generatedOtp);
    return;
  }
  // Check if this mobile number already has a saved profile
  if (state.savedProfiles[state.mobile]) {
    Object.assign(state, state.savedProfiles[state.mobile]);
    state.loggedInMobile = state.mobile;
    persistStore();
    showToast('Welcome back, ' + (state.name || state.mobile) + '!');
    goTo('dashboard');
  } else {
    // New or different mobile number -> reset profile fields for fresh onboarding
    Object.assign(state, {
      name: '', dobDay: '', dobMonth: '', dobYear: '', gender: '',
      pincode: ['', '', '', '', '', ''], city: '', stateName: '',
      areaType: '', occupation: '', education: '', category: '', disability: '',
      digiLockerConnected: false
    });
    goTo('digilocker-opt');
  }
}

function pressPinKey(k) {
  if (k === 'Clear') {
    state.pincode = ['', '', '', '', '', ''];
  } else if (k === '⌫') {
    const lastIdx = state.pincode.findLastIndex(d => d !== '');
    if (lastIdx >= 0) state.pincode[lastIdx] = '';
  } else {
    const nextIdx = state.pincode.findIndex(d => d === '');
    if (nextIdx >= 0) state.pincode[nextIdx] = k;
  }
  render();
}

function lookupPinAndNext() {
  const code = state.pincode.join('');
  if (code.length < 6) {
    showToast('Please enter all 6 digits of your PIN code');
    return;
  }
  const match = PIN_DIRECTORY[code] || { city: 'Bengaluru', state: 'Karnataka' };
  state.city = match.city;
  state.stateName = match.state;
  goTo('location');
}

function handleChatSubmit(e) {
  e.preventDefault();
  const q = state.chatInput.trim();
  if (!q) return;
  state.chatMessages.push({ role: 'user', text: q });
  state.history.unshift({ id: Date.now(), time: 'Just now', title: q, type: 'Chat' });
  const ql = q.toLowerCase();
  const match = SCHEMES.find(s => ql.includes(s.name.toLowerCase().split(' ')[0]) || ql.includes(s.category.toLowerCase().split(' ')[0]));
  const reply = match
    ? `<strong>${match.name}</strong> (${match.level}): ${match.benefit}. ${match.desc} Required docs: ${match.docs.join(', ')}.`
    : `Based on your profile (${state.city || 'India'}, ${state.occupation || 'Citizen'}), explore <strong>Ayushman Bharat</strong> or open <em>${t('findSchemes')}</em>.`;
  state.chatMessages.push({ role: 'assistant', text: reply });
  state.chatInput = '';
  render();
}

function syncDigiLockerDocs() {
  state.digiLockerConnected = true;
  state.docs.forEach(d => {
    if (d.status === 'Pending') {
      d.status = 'Verified';
      d.updated = 'Synced via DigiLocker';
      d.number = 'DL-' + Math.floor(10000 + Math.random() * 90000);
    }
  });
  showToast('All DigiLocker documents synced!');
  render();
}

function verifyDoc(id) {
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  if (doc.status === 'Pending') {
    doc.status = 'Verified';
    doc.updated = 'Fetched via DigiLocker';
    doc.number = 'DL-' + Math.floor(10000 + Math.random() * 90000);
    showToast(doc.name + ' verified!');
    render();
  } else {
    showToast(`${doc.name}: ${doc.number} (${doc.issuer})`);
  }
}

function handleDocUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const allowedTypes = ['application/pdf', 'image/jpeg', 'image/jpg'];
  if (!allowedTypes.includes(file.type) && !file.name.match(/\.(pdf|jpe?g)$/i)) {
    showToast('Please upload PDF, JPG, or PNG files only.');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const previewUrl = e.target.result;
    const existingDoc = state.docs.find(d => d.name === 'Custom Document');
    if (existingDoc) {
      existingDoc.status = 'Verified';
      existingDoc.updated = 'Uploaded via device';
      existingDoc.number = file.name;
      existingDoc.preview = previewUrl;
    } else {
      const newDoc = {
        id: 'custom-' + Date.now(),
        name: file.name.replace(/\.[^.]*.$/, ''),
        issuer: 'Device',
        status: 'Verified',
        updated: 'Uploaded via device',
        number: file.name,
        preview: previewUrl
      };
      state.docs.push(newDoc);
    }
    showToast('Document uploaded successfully!');
    render();
  };

  if (file.type) {
    reader.readAsDataURL(file);
  } else {
    reader.readAsDataURL(file.slice(0, file.size));
  }
}

// Clean up the file input value after reading
function cleanupDocUploadInput() {
  const input = document.getElementById('doc-upload');
  if (input) input.value = '';
}

function openDocUpload() {
  const input = document.getElementById('doc-upload');
  if (input) {
    input.click();
    // Call cleanup after a short delay to allow file selection
    setTimeout(cleanupDocUploadInput, 100);
  }
}

// For camera access on supported devices
async function captureImage() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    const videoElement = document.createElement('video');
    videoElement.srcObject = stream;
    videoElement.play();

    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    canvas.getContext('2d').drawImage(videoElement, 0, 0, 512, 512);

    const image = canvas.toDataURL('image/jpeg');
    const file = new Blob([image], { type: 'image/jpeg' });
    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);

    document.getElementById('doc-upload').files = dataTransfer.files;
    document.getElementById('doc-upload').dispatchEvent(new Event('change', { bubbles: true }));

    stream.getTracks().forEach(track => track.stop());
  } catch (err) {
    showToast('Camera access denied or not supported.');
  }
}

// For gallery/photo selection
function selectFromGallery() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';
  input.onchange = function(e) {
    document.getElementById('doc-upload').files = e.target.files;
    document.getElementById('doc-upload').dispatchEvent(new Event('change', { bubbles: true }));
    setTimeout(cleanupDocUploadInput, 100);
  };
  input.click();
}

// Handle document replace
function handleDocReplace(id) {
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf,.jpg,.jpeg,.png';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      doc.status = 'Verified';
      doc.updated = 'Updated via device';
      doc.number = file.name;
      doc.preview = e.target.result;
      showToast('Document updated successfully!');
      render();
    };
    if (file.type) {
      reader.readAsDataURL(file);
    }
    cleanupDocUploadInput();
  };
  input.click();
}

// Handle document remove
function handleDocRemove(id) {
  const idx = state.docs.findIndex(d => d.id === id);
  if (idx > -1) {
    state.docs.splice(idx, 1);
    showToast('Document removed.');
    render();
  }
}

function renderEditableProfileFields(flagKey) {
  const isEdit = state[flagKey];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const pinVal = state.pincode.join('');
  if (!isEdit) {
    const rows = [
      ['Full Name', state.name || 'Not set'],
      ['Mobile Number', state.mobile ? '+91 ' + state.mobile : 'Not set'],
      ['Date of Birth', (state.dobDay && state.dobMonth && state.dobYear) ? `${state.dobDay} ${state.dobMonth} ${state.dobYear}` : 'Not set'],
      ['Gender', state.gender || 'Not set'],
      ['PIN Code', pinVal || 'Not set'],
      ['Location', (state.city && state.stateName) ? `${state.city}, ${state.stateName}` : 'Not set'],
      ['Area Type', state.areaType || 'Not set'],
      ['Occupation', state.occupation || 'Not set'],
      ...(state.occupation === 'Student' ? [['Education', state.education || 'Not set']] : []),
      ['Caste / Category', state.category || 'Not set'],
      ['Disability', state.disability || 'Not set']
    ];
    return `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
        ${rows.map(([k, v]) => `
          <div class="p-3.5 rounded-xl bg-[#F7F5FF] border border-[#EAE6FA]">
            <span class="text-xs text-slate-500 block mb-0.5">${k}</span>
            <strong class="text-[#1E1B4B]">${v}</strong>
          </div>`).join('')}
      </div>`;
  }
  return `
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Full Name</label>
        <input type="text" value="${state.name}" oninput="state.name=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] focus:border-[#5B2DD6] focus:outline-none" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Mobile Number</label>
        <input type="tel" maxlength="10" value="${state.mobile}" oninput="state.mobile=this.value.replace(/\\D/g,'').slice(0,10)" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] focus:border-[#5B2DD6] focus:outline-none" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Date of Birth</label>
        <div class="grid grid-cols-3 gap-1.5">
          <input type="text" placeholder="Day" maxlength="2" value="${state.dobDay}" oninput="state.dobDay=this.value" class="border-2 border-[#DCD4FA] rounded-xl px-2 py-2 font-semibold text-[#1E1B4B] text-center" />
          <select onchange="state.dobMonth=this.value" class="border-2 border-[#DCD4FA] rounded-xl px-1 py-2 font-semibold text-[#1E1B4B] bg-white">
            <option value="">Month</option>
            ${months.map(m => `<option value="${m}" ${state.dobMonth===m?'selected':''}>${m.slice(0,3)}</option>`).join('')}
          </select>
          <input type="text" placeholder="Year" maxlength="4" value="${state.dobYear}" oninput="state.dobYear=this.value" class="border-2 border-[#DCD4FA] rounded-xl px-2 py-2 font-semibold text-[#1E1B4B] text-center" />
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Gender</label>
        <select onchange="state.gender=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['Male','Female','Other'].map(g => `<option value="${g}" ${state.gender===g?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">PIN Code</label>
        <input type="tel" maxlength="6" value="${pinVal}" oninput="updatePinFromSummary(this.value)" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] focus:border-[#5B2DD6] focus:outline-none" />
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Area Type</label>
        <select onchange="state.areaType=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['Rural / Village','Urban / City'].map(a => `<option value="${a}" ${state.areaType===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Occupation</label>
        <select onchange="state.occupation=this.value; render()" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['Farmer','Worker','Business','Student','Homemaker','Other'].map(o => `<option value="${o}" ${state.occupation===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>
      ${state.occupation === 'Student' ? `
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Education</label>
        <select onchange="state.education=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['School','College','IT / Computer course','Skill / Vocational course','Other'].map(e => `<option value="${e}" ${state.education===e?'selected':''}>${e}</option>`).join('')}
        </select>
      </div>` : ''}
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Caste / Category</label>
        <select onchange="state.category=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['General','SC/ST','OBC','Other'].map(c => `<option value="${c}" ${state.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 block mb-1">Disability</label>
        <select onchange="state.disability=this.value" class="w-full border-2 border-[#DCD4FA] rounded-xl px-3 py-2 font-semibold text-[#1E1B4B] bg-white">
          <option value="">Select</option>
          ${['Yes','No'].map(d => `<option value="${d}" ${state.disability===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>`;
}

function updatePinFromSummary(val) {
  const clean = val.replace(/\D/g, '').slice(0, 6);
  state.pincode = Array.from({ length: 6 }, (_, i) => clean[i] || '');
  if (clean.length === 6) {
    const match = PIN_DIRECTORY[clean] || { city: 'Bengaluru', state: 'Karnataka' };
    state.city = match.city;
    state.stateName = match.state;
  }
}

function saveCurrentProfileToStore() {
  if (!state.mobile) return;
  state.savedProfiles[state.mobile] = {
    mobile: state.mobile,
    name: state.name,
    dobDay: state.dobDay,
    dobMonth: state.dobMonth,
    dobYear: state.dobYear,
    gender: state.gender,
    pincode: [...state.pincode],
    city: state.city,
    stateName: state.stateName,
    areaType: state.areaType,
    occupation: state.occupation,
    education: state.education,
    category: state.category,
    disability: state.disability,
    digiLockerConnected: state.digiLockerConnected
  };
  state.loggedInMobile = state.mobile;
  persistStore();
}

function toggleSummaryEdit() {
  state.editingSummary = !state.editingSummary;
  if (!state.editingSummary) {
    saveCurrentProfileToStore();
    showToast('Profile changes saved!');
  }
  render();
}

function toggleMainProfileEdit() {
  state.editingMainProfile = !state.editingMainProfile;
  if (!state.editingMainProfile) {
    saveCurrentProfileToStore();
    showToast('Profile updated!');
  }
  render();
}

function confirmProfileAndEnter() {
  state.editingSummary = false;
  saveCurrentProfileToStore();
  showToast('Profile confirmed!');
  goTo('dashboard');
}

// ============================================================
// SCREEN DRAWER & RENDERER
// ============================================================
function toggleScreenDrawer() {
  document.getElementById('screen-drawer').classList.toggle('hidden');
}

function renderScreenDrawer() {
  const cur = SCREEN_LIST.find(s => s.id === state.screen) || SCREEN_LIST[0];
  document.getElementById('nav-badge').textContent = `Screen ${cur.num} / ${SCREEN_LIST.length}`;
  document.getElementById('screen-drawer-list').innerHTML = SCREEN_LIST.map(s => `
    <button onclick="goTo('${s.id}'); toggleScreenDrawer()" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center justify-between ${s.id === state.screen ? 'bg-[#5B2DD6] text-white font-bold' : 'hover:bg-[#EFEAFF] text-[#1E1B4B]'}">
      <span>${s.num}. ${s.title}</span>
      <span class="text-[10px] opacity-75">P${s.phase}</span>
    </button>`).join('');
}

function render() {
  const app = document.getElementById('app');
  const isPhase2 = ['dashboard', 'mydocs', 'find-schemes', 'eligibility', 'history', 'profile', 'others'].includes(state.screen);
  app.innerHTML = isPhase2 ? renderMainApp() : renderOnboarding();
  renderScreenDrawer();
}

render();
</script>
</body>
</html>
