      background: #fff;
      border: 1.5px solid #EAE6FA;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(91, 45, 214, 0.05);
    }
    .card-selectable:hover {
      border-color: var(--purple);
      box-shadow: 0 6px 20px rgba(91, 45, 214, 0.10);
    }
    .card-selected {
      border-color: var(--purple) !important;
      background: #EFEAFF !important;
      box-shadow: 0 6px 20px rgba(91, 45, 214, 0.14) !important;
    }

function normalizeMobile(v) {
  return String(v || '').replace(/\D/g, '').slice(0, 10);
}

function isValidIndianMobile(v) {
  return /^[6-9]\d{9}$/.test(String(v || ''));
}

function loadSavedStore() {
  try {
    const raw = localStorage.getItem('labhya_store_v1');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try {
    if (window.name && window.name.startsWith('LABHYA:')) {
      return JSON.parse(window.name.slice(7));
    }
  } catch (e) {}
  return { savedProfiles: {}, loggedInMobile: '', langCode: 'en' };
}

function persistStore() {
  const payload = JSON.stringify({
    savedProfiles: state.savedProfiles,
    loggedInMobile: state.loggedInMobile,
    langCode: state.langCode
  });
  try { localStorage.setItem('labhya_store_v1', payload); } catch (e) {}
  try { window.name = 'LABHYA:' + payload; } catch (e) {}
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 2600);
}

function speakText(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const langObj = LANGUAGES.find(l => l.code === state.langCode) || LANGUAGES[0];
      u.lang = langObj.speech;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
      showToast('🔊 ' + text.slice(0, 44) + (text.length > 44 ? '...' : ''));
    }
  } catch (e) {}
}

function goTo(screenId) {
  state.screen = screenId;
  state.mobileSidebarOpen = false;
  if (screenId === 'otp') startOtpTimer();
  else clearInterval(otpInterval);
  render();
}

function startOtpTimer() {
  clearInterval(otpInterval);
  state.otpTimer = 30;
  otpInterval = setInterval(() => {
    if (state.otpTimer > 0) {
      state.otpTimer--;
      const el = document.getElementById('otp-timer-text');
      if (el) el.textContent = `${t('resendOtp')} (00:${String(state.otpTimer).padStart(2, '0')})`;
    } else {
      clearInterval(otpInterval);
    }
  }, 1000);
}

function languagePillHTML() {
  return `
  <div class="relative inline-block">
    <select aria-label="Language" onchange="changeLanguage(this.value)" class="appearance-none bg-white border border-[#DCD4FA] text-[#5B2DD6] text-sm font-semibold rounded-full pl-4 pr-9 py-1.5 cursor-pointer focus:outline-none focus:border-[#5B2DD6]">
      ${LANGUAGES.map(l => `<option value="${l.code}" ${state.langCode === l.code ? 'selected' : ''}>${l.label}</option>`).join('')}
    </select>
    <svg class="w-4 h-4 text-[#5B2DD6] pointer-events-none absolute right-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
  </div>`;
}

function changeLanguage(code) {
  state.langCode = code;
  persistStore();
  const langObj = LANGUAGES.find(l => l.code === code);
  if (langObj) showToast('Language: ' + langObj.native);
  render();
}

function speakerBtnHTML(textToSpeak) {
  const safe = textToSpeak.replace(/'/g, "\\'");
  return `
  <button onclick="speakText('${safe}')" title="Listen" class="w-9 h-9 rounded-full bg-[#EFEAFF] hover:bg-[#E1D7FF] text-[#5B2DD6] flex items-center justify-center">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  </button>`;
}

function onboardingHeaderHTML({ backScreen = null, step = null, totalSteps = 11, speak = '' }) {
  const dots = step !== null ? `
    <div class="flex items-center gap-1.5">
      ${Array.from({ length: totalSteps }, (_, i) => {
        const idx = i + 1;
        if (idx < step) return `<span class="w-2.5 h-2.5 rounded-full bg-[#18A957]"></span>`;
        if (idx === step) return `<span class="w-6 h-2.5 rounded-full bg-[#5B2DD6]"></span>`;
        return `<span class="w-2.5 h-2.5 rounded-full bg-[#E2DCF8]"></span>`;
      }).join('')}
    </div>` : `<div></div>`;

  return `
  <header class="w-full max-w-4xl mx-auto px-6 pt-5 pb-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      ${backScreen ? `
        <button onclick="goTo('${backScreen}')" class="w-9 h-9 rounded-full hover:bg-[#EFEAFF] text-[#5B2DD6] flex items-center justify-center" title="${t('back')}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>` : `<div class="flex items-center gap-2">${labhyaLogoSVG(34)}<span class="font-bold text-[#5B2DD6] text-lg">Labhya</span></div>`}
    </div>
    <div class="hidden sm:flex justify-center">${dots}</div>
    <div class="flex items-center gap-2.5">
      ${speak ? speakerBtnHTML(speak) : ''}
      ${languagePillHTML()}
    </div>
  </header>
  ${step !== null ? `<div class="sm:hidden flex justify-center pb-2">${dots}</div>` : ''}`;
}

function handleGetStarted() {
  if (state.loggedInMobile && state.savedProfiles[state.loggedInMobile]) {
    Object.assign(state, state.savedProfiles[state.loggedInMobile]);
    state.isReturningUser = true;
    showToast(`${t('welcomeBackUser')}, ${state.name || state.mobile}!`);
    goTo('dashboard');
    return;
  }
  goTo('language');
}

function selectLanguageAndStay(code) {
  state.langCode = code;
  persistStore();
  render();
}

function generateMockOtp() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function handleMobileInput(val) {
  state.mobile = normalizeMobile(val);
  const hint = document.getElementById('registered-hint');
  if (hint) {
    const found = isValidIndianMobile(state.mobile) && state.savedProfiles[state.mobile] && state.savedProfiles[state.mobile].name;
    hint.textContent = found ? ('✓ Registered account found (' + found.name + ')') : '';
  }
}

async function submitMobile() {
  const inputEl = document.getElementById('mobile-input');
  if (inputEl) state.mobile = normalizeMobile(inputEl.value);
  if (!isValidIndianMobile(state.mobile)) {
    showToast('Enter a valid 10-digit Indian mobile number (starts with 6, 7, 8, or 9)');
    return;
  }
  let otpCode = generateMockOtp();
  if (API_ENABLED) {
    const res = await apiCall('/api/auth/request-otp', 'POST', { mobile: state.mobile });
    if (res && res.mock_otp) otpCode = res.mock_otp;
  }
  state.generatedOtp = otpCode;
  state.otp = ['', '', '', '', '', ''];
  showToast('Mock OTP sent: ' + state.generatedOtp);
  goTo('otp');
}

function resendOtp() {
  state.generatedOtp = generateMockOtp();
  state.otp = ['', '', '', '', '', ''];
  startOtpTimer();
  showToast('New Mock OTP sent: ' + state.generatedOtp);
  render();
}

function updateOtp(idx, el) {
  const clean = String(el.value || '').replace(/\D/g, '').slice(-1);
  state.otp[idx] = clean;
  el.value = clean;
  if (clean && idx < 5) {
    const next = document.getElementById('otp-box-' + (idx + 1));
    if (next) next.focus();
  }
}

function handleOtpKey(idx, e) {
  if (e.key === 'Backspace') {
    e.preventDefault();
    const curEl = document.getElementById('otp-box-' + idx);
    if (state.otp[idx]) {
      state.otp[idx] = '';
      if (curEl) curEl.value = '';
      if (idx > 0) {
        const prev = document.getElementById('otp-box-' + (idx - 1));
        if (prev) prev.focus();
      }
    } else if (idx > 0) {
      state.otp[idx - 1] = '';
      const prev = document.getElementById('otp-box-' + (idx - 1));
      if (prev) {
        prev.value = '';
        prev.focus();
      }
    }
  } else if (e.key === 'ArrowLeft' && idx > 0) {
    const prev = document.getElementById('otp-box-' + (idx - 1));
    if (prev) prev.focus();
  } else if (e.key === 'ArrowRight' && idx < 5) {
    const next = document.getElementById('otp-box-' + (idx + 1));
    if (next) next.focus();
  }
}

function handleOtpPaste(e) {
  const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
  if (!pasted) return;
  e.preventDefault();
  for (let i = 0; i < 6; i++) {
    state.otp[i] = pasted[i] || '';
    const box = document.getElementById('otp-box-' + i);
    if (box) box.value = state.otp[i];
  }
  const focusIdx = Math.min(pasted.length, 5);
  const target = document.getElementById('otp-box-' + focusIdx);
  if (target) target.focus();
}

async function verifyOtp() {
  const entered = state.otp.join('');
  if (entered.length < 6) {
    showToast('Please enter all 6 digits of the OTP');
    return;
  }
  if (state.generatedOtp && entered !== state.generatedOtp) {
    state.otp = ['', '', '', '', '', ''];
    for (let i = 0; i < 6; i++) {
      const box = document.getElementById('otp-box-' + i);
      if (box) box.value = '';
    }
    const firstBox = document.getElementById('otp-box-0');
    if (firstBox) firstBox.focus();
    showToast('Incorrect OTP. Please re-enter (Mock OTP: ' + state.generatedOtp + ')');
    return;
  }

  const key = normalizeMobile(state.mobile);
  state.mobile = key;

  if (API_ENABLED) {
    const apiRes = await apiCall('/api/auth/verify-otp', 'POST', { mobile: key, otp: entered });
    if (apiRes && apiRes.token) {
      authToken = apiRes.token;
      if (apiRes.is_returning_user && apiRes.profile && apiRes.profile.name) {
        const p = apiRes.profile;
        Object.assign(state, {
          name: p.name || '',
          gender: p.gender || '',
          category: p.social_category || '',
          stateName: p.state || 'Karnataka',
          city: p.district || '',
          pincode: Array.from({ length: 6 }, (_, i) => (p.pincode || '')[i] || ''),
          areaType: p.area_type || '',
          occupation: p.occupation || '',
          education: p.education || '',
          disability: p.disability_status || '',
          digiLockerConnected: !!p.digilocker_connected
        });
        saveCurrentProfileToStore();
        state.isReturningUser = true;
        showToast(`${t('welcomeBackUser')}, ${state.name}!`);
        goTo('dashboard');
        return;
      }
    }
  }

  if (state.savedProfiles[key] && state.savedProfiles[key].name) {
    Object.assign(state, state.savedProfiles[key]);
    state.loggedInMobile = key;
    state.isReturningUser = true;
    persistStore();
    showToast(`${t('welcomeBackUser')}, ${state.name}!`);
    goTo('dashboard');
  } else {
    Object.assign(state, {
      name: '', dobDay: '', dobMonth: '', dobYear: '', gender: '',
      pincode: ['', '', '', '', '', ''], city: '', stateName: '',
      areaType: '', occupation: '', education: '', category: '', disability: '',
      digiLockerConnected: false,
      isReturningUser: false
    });
    goTo('digilocker-opt');
  }
}

function pressPinKey(k) {
  if (k === 'Clear') {
    state.pincode = ['', '', '', '', '', ''];
  } else if (k === '⌫') {
    const lastIdx = state.pincode.findLastIndex(d => d !== '');
    if (lastIdx >= 0) state.pincode[lastIdx] = '';
  } else {
    const nextIdx = state.pincode.findIndex(d => d === '');
    if (nextIdx >= 0) state.pincode[nextIdx] = k;
  }
  render();
}

function lookupPinAndNext() {
  const code = state.pincode.join('');
  if (code.length < 6) {
    showToast('Please enter all 6 digits of your PIN code');
    return;
  }
  const match = PIN_DIRECTORY[code] || { city: 'Bengaluru', state: 'Karnataka' };
  state.city = match.city;
  state.stateName = match.state;
  goTo('location');
}

function handleChatFilesSelected(fileList) {
  if (!fileList || !fileList.length) return;
  Array.from(fileList).forEach(file => {
    const isImage = file.type.startsWith('image/');
    const url = URL.createObjectURL(file);
    state.chatAttachments.push({ name: file.name, size: file.size, type: file.type, isImage, url });
  });
  render();
}

function removeChatAttachment(idx) {
  state.chatAttachments.splice(idx, 1);
  render();
}

let activeCameraStream = null;
async function openCameraModal() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const fallback = document.getElementById('chat-camera-fallback');
    if (fallback) fallback.click();
    return;
  }
  const backdrop = document.getElementById('modal-backdrop');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-lg font-extrabold text-[#5B2DD6]">Camera Capture</h3>
      <button onclick="closeCameraModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-black">✕</button>
    </div>
    <div class="rounded-2xl overflow-hidden bg-black mb-4 aspect-video flex items-center justify-center">
      <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
    </div>
    <div class="flex gap-3">
      <button onclick="captureCameraPhoto()" class="btn-purple flex-1 py-3 rounded-full font-bold text-sm">Capture Photo</button>
      <button onclick="closeCameraModal(); document.getElementById('chat-camera-fallback').click();" class="px-4 py-3 rounded-full border border-[#DCD4FA] text-xs font-semibold text-black">Choose File Instead</button>
    </div>`;
  backdrop.classList.remove('hidden');
  try {
    activeCameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('camera-video');
    if (video) video.srcObject = activeCameraStream;
  } catch (err) {
    closeCameraModal();
    showToast('Camera permission unavailable — opening file picker');
    const fallback = document.getElementById('chat-camera-fallback');
    if (fallback) fallback.click();
  }
}

function captureCameraPhoto() {
  const video = document.getElementById('camera-video');
  if (!video || !video.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    if (blob) {
      const url = URL.createObjectURL(blob);
      state.chatAttachments.push({ name: 'camera-photo-' + Date.now() + '.jpg', size: blob.size, type: 'image/jpeg', isImage: true, url });
    }
    closeCameraModal();
    render();
  }, 'image/jpeg', 0.9);
}

function closeCameraModal() {
  if (activeCameraStream) {
    activeCameraStream.getTracks().forEach(tr => tr.stop());
    activeCameraStream = null;
  }
  closeModal();
}

async function handleChatSubmit(e) {
  e.preventDefault();
  const q = state.chatInput.trim();
  const atts = [...state.chatAttachments];
  if (!q && !atts.length) return;
  state.chatMessages.push({ role: 'user', text: q, attachments: atts });
  state.history.unshift({ id: Date.now(), time: 'Just now', title: q || ('Uploaded ' + atts.map(a => a.name).join(', ')), type: 'Chat' });
  const ql = q.toLowerCase();
  const match = SCHEMES.find(s => ql.includes(s.name.toLowerCase().split(' ')[0]) || ql.includes(s.category.toLowerCase().split(' ')[0]));
  let reply = '';
  if (atts.length && !q) {
    reply = `Received <strong>${atts.length} file(s)</strong> (${atts.map(a => a.name).join(', ')}). Ask what you'd like to check or upload official certificates under <em>${t('myDocs')}</em>.`;
  } else if (match) {
    reply = `<strong>${match.name}</strong> (${match.level}): ${match.benefit}. ${match.desc} Required docs: ${match.docs.join(', ')}.`;
  } else {
    reply = `Based on your profile (${state.city || 'India'}, ${state.occupation || 'Citizen'}), explore <strong>Ayushman Bharat</strong> or open <em>${t('findSchemes')}</em>.${atts.length ? ' Attached: ' + atts.map(a => a.name).join(', ') + '.' : ''}`;
  }
  if (API_ENABLED && authToken && q) {
    const apiRes = await apiCall('/api/chat', 'POST', { message: q, session_id: activeChatSessionId });
    if (apiRes && apiRes.reply) {
      activeChatSessionId = apiRes.session_id;
      reply = apiRes.reply.replace(/\n/g, '<br/>');
    }
  }
  state.chatMessages.push({ role: 'assistant', text: reply });
  state.chatInput = '';
  state.chatAttachments = [];
  saveCurrentProfileToStore();
  render();
  const scroller = document.getElementById('dashboard-scroll-area');
  if (scroller) scroller.scrollTop = scroller.scrollHeight;
}

function uploadDocFromFolder(id, file) {
  if (!file) return;
  const doc = state.docs.find(d => d.id === id);
  if (!doc) return;
  doc.status = 'Uploaded';
  doc.fileName = file.name;
  doc.fileSize = Math.max(1, Math.round(file.size / 1024)) + ' KB';
  doc.fileType = file.type;
  doc.fileUrl = URL.createObjectURL(file);
  doc.updated = `Uploaded (${doc.fileSize}) · Pending verification`;
  showToast(doc.name + ' uploaded');
  render();
}

function addCustomDoc(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  const size = Math.max(1, Math.round(file.size / 1024)) + ' KB';
  state.docs.push({
    id: 'doc-' + Date.now(),
    name: file.name.replace(/\.[^.]+$/, ''),
    issuer: 'User Upload',
    status: 'Uploaded',
    fileName: file.name,
    fileSize: size,
    fileType: file.type,
    fileUrl: url,
    updated: `Uploaded (${size}) · Pending verification`
  });

  render();
}

function updatePinFromSummary(val) {
  const clean = val.replace(/\D/g, '').slice(0, 6);
  state.pincode = Array.from({ length: 6 }, (_, i) => clean[i] || '');
  if (clean.length === 6) {
    const match = PIN_DIRECTORY[clean] || { city: 'Bengaluru', state: 'Karnataka' };
    state.city = match.city;
    state.stateName = match.state;
  }
}

function saveCurrentProfileToStore() {
  const key = normalizeMobile(state.mobile);
  if (key.length < 10) return;
  state.mobile = key;
  state.savedProfiles[key] = {
    mobile: state.mobile,
    name: state.name,
    dobDay: state.dobDay,
    dobMonth: state.dobMonth,
    dobYear: state.dobYear,
    gender: state.gender,
    pincode: [...state.pincode],
    city: state.city,
    stateName: state.stateName,
    areaType: state.areaType,
    occupation: state.occupation,
    education: state.education,
    category: state.category,
    disability: state.disability,
    digiLockerConnected: state.digiLockerConnected,
    chatMessages: state.chatMessages || [],
    history: state.history || []
  };
  state.loggedInMobile = key;
  persistStore();
  syncProfileToBackend();
}

function toggleSummaryEdit() {
  state.editingSummary = !state.editingSummary;
  if (!state.editingSummary) {
    saveCurrentProfileToStore();
    showToast('Profile changes saved!');
  }
  render();
}

function toggleMainProfileEdit() {
  state.editingMainProfile = !state.editingMainProfile;
  if (!state.editingMainProfile) {
    saveCurrentProfileToStore();
    showToast('Profile updated!');
  }
  render();
}

function confirmProfileAndEnter() {
  state.editingSummary = false;
  saveCurrentProfileToStore();
  showToast('Profile confirmed!');
  goTo('dashboard');
}

// ============================================================

// ============================================================
// BACKEND API BRIDGE (Active when served by FastAPI server.py)
// ============================================================
const API_ENABLED = window.location.protocol.startsWith('http');
let authToken = '';
let activeChatSessionId = null;

async function apiCall(path, method = 'GET', body = null) {
  if (!API_ENABLED) return null;
  try {
    const headers = { 'Content-Type': 'application/json' };
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const resp = await fetch(path, {
      method,
      headers,
      body: body ? JSON.stringify(body) : null
    });
    if (!resp.ok) return null;
    return await resp.json();
  } catch (e) {
    return null;
  }
}

async function syncProfileToBackend() {
  if (!API_ENABLED || !authToken) return;
  const dob = (state.dobDay && state.dobMonth && state.dobYear)
    ? `${state.dobDay} ${state.dobMonth} ${state.dobYear}` : null;
  await apiCall('/api/profile', 'PUT', {
    name: state.name || null,
    dob,
    gender: state.gender || null,
    social_category: state.category || null,
    state: state.stateName || null,
    district: state.city || null,
    pincode: state.pincode.join('') || null,
    area_type: state.areaType || null,
    occupation: state.occupation || null,
    education: state.education || null,
    disability_status: state.disability || null,
    language: state.langCode,
    digilocker_connected: !!state.digiLockerConnected
  });
}

async function createDraftViaBackend(schemeId) {
  const res = await apiCall('/api/drafts', 'POST', { scheme_id: schemeId });
  if (res && res.id) {
    showToast('Application draft saved: ' + res.id);
    return res;
  }
  showToast('Draft preview prepared locally');
  return null;
}

// RENDERER
// ============================================================
function render() {
  const app = document.getElementById('app');
  const isPhase2 = ['dashboard', 'mydocs', 'find-schemes', 'eligibility', 'history', 'profile', 'others'].includes(state.screen);
  app.innerHTML = isPhase2 ? renderMainApp() : renderOnboarding();
}


// Global keyboard support (Enter for Next/Continue/Confirm on mobile, laptop, desktop + numeric keys for PIN)
function triggerPrimaryScreenAction() {
  switch (state.screen) {
    case 'welcome': handleGetStarted(); break;
    case 'language': goTo('mobile'); break;
    case 'mobile': submitMobile(); break;
    case 'otp': verifyOtp(); break;
    case 'digilocker-opt': goTo('digilocker-connect'); break;
    case 'digilocker-connect': state.digiLockerConnected = true; goTo('digilocker-done'); break;
    case 'digilocker-done': goTo('start-profile'); break;
    case 'start-profile': goTo('name'); break;
    case 'name':
      if (!state.name.trim()) { showToast(t('namePlaceholder')); return; }
      goTo('dob');
      break;
    case 'dob':
      if (!state.dobDay || !state.dobMonth || !state.dobYear) { showToast('Please select Day, Month, and Year'); return; }
      goTo('gender');
      break;
    case 'gender':
      if (!state.gender) { showToast('Please select your gender'); return; }
      goTo('pincode');
      break;
    case 'pincode': lookupPinAndNext(); break;
    case 'location': goTo('rural-urban'); break;
    case 'rural-urban':
      if (!state.areaType) { showToast('Please select an area type'); return; }
      goTo('occupation');
      break;
    case 'occupation':
      if (!state.occupation) { showToast('Please select your occupation'); return; }
      goTo(state.occupation === 'Student' ? 'education' : 'caste');
      break;
    case 'education':
      if (!state.education) { showToast('Please select what you are studying'); return; }
      goTo('caste');
      break;
    case 'caste':
      if (!state.category) { showToast('Please select your caste/category'); return; }
      goTo('disability');
      break;
    case 'disability':
      if (!state.disability) { showToast('Please select Yes or No'); return; }
      state.editingSummary = false;
      goTo('profile-complete');
      break;
    case 'profile-complete':
      if (state.editingSummary) toggleSummaryEdit();
      else confirmProfileAndEnter();
      break;
  }
}

document.addEventListener('keydown', (e) => {
  const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');
  if (modalOpen) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (state.screen === 'pincode') {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressPinKey(e.key); return; }
    if (e.key === 'Backspace') { e.preventDefault(); pressPinKey('⌫'); return; }
  }
  if (e.key === 'Enter') {
    const tag = e.target && e.target.tagName;
    if (e.target && e.target.id === 'chat-search-input') return;
    if (tag === 'BUTTON' || tag === 'A' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'LABEL') return;
    e.preventDefault();
    triggerPrimaryScreenAction();
  }
});

render();
</script>
</body>
</html>
